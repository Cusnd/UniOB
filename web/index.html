<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090e" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var scheme = localStorage.getItem("uniob-color-scheme");
          var meta = document.querySelector('meta[name="color-scheme"]');
          var isDark;
          if (scheme === "dark" || scheme === "light") {
            if (meta) meta.setAttribute("content", scheme);
            root.dataset.theme = scheme;
            isDark = scheme === "dark";
          } else {
            if (meta) meta.setAttribute("content", "light dark");
            root.dataset.theme = "system";
            isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          root.classList.toggle("dark", isDark);

          var accent = localStorage.getItem("uniob-accent");
          root.dataset.accent =
            accent === "emerald" || accent === "indigo" || accent === "cyan"
              ? accent
              : "emerald";

          var density = localStorage.getItem("uniob-density");
          root.dataset.density =
            density === "comfortable" || density === "compact"
              ? density
              : "comfortable";

          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute("content", isDark ? "#07090e" : "#f5f7fa");
          }
        } catch (e) {}
      })();
    </script>
    <title>UniOB — 服务器可观测性面板</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
