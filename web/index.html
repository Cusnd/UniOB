<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="cobalt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f3" />
    <meta name="color-scheme" content="light" />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var savedScheme = localStorage.getItem("uniob-color-scheme");
          var metaScheme = document.querySelector('meta[name="color-scheme"]');
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          var resolved = "light";
          if (savedScheme === "dark") {
            resolved = "dark";
            if (metaScheme) metaScheme.setAttribute("content", "dark");
          } else if (savedScheme === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
            if (metaScheme) metaScheme.setAttribute("content", "light dark");
          } else {
            resolved = "light";
            if (metaScheme) metaScheme.setAttribute("content", "light");
          }
          root.dataset.theme = resolved;
          root.classList.toggle("dark", resolved === "dark");
          if (metaTheme) {
            metaTheme.setAttribute(
              "content",
              resolved === "dark" ? "#111110" : "#f6f6f3",
            );
          }

          var savedAccent = localStorage.getItem("uniob-accent");
          root.dataset.accent =
            savedAccent === "vermilion" || savedAccent === "jade"
              ? savedAccent
              : "cobalt";
        } catch (e) {}
      })();
    </script>
    <title>UniOB · 服务器监控</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
