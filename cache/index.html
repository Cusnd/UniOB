<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>UniOB · 组件原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f3;color:#18181b;font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif}header{min-height:68px;padding:14px 24px;display:flex;align-items:center;gap:24px;border-bottom:1px solid #e5e5e1;background:#fff}h1{font-size:16px;letter-spacing:-.4px;margin:0;white-space:nowrap}h1 span{font-weight:400;color:#71717a;margin-left:10px}nav{display:flex;gap:4px;flex-wrap:wrap}nav a{color:#62626a;text-decoration:none;padding:8px 12px;border-radius:7px;white-space:nowrap}nav a:hover{background:#f5f5f3}nav a[aria-current="page"]{background:#eef0ff;color:#3d5afe}a:focus-visible{outline:2px solid #3d5afe;outline-offset:3px}.open{margin-left:auto;color:#52525b;text-decoration:none;white-space:nowrap;font-size:13px}.open:hover{color:#3d5afe}main{margin:24px;background:#fff;border:1px solid #e7e7e4;border-radius:14px;overflow:hidden;min-height:calc(100vh - 117px)}iframe{display:block;width:100%;height:calc(100vh - 119px);min-height:480px;border:0;background:white}@media(max-width:900px){header{gap:12px;padding:14px 16px;flex-wrap:wrap}nav{order:3;flex-basis:100%;gap:2px}nav a{padding:7px 9px}main{margin:12px}iframe{height:calc(100vh - 145px)}}
</style>
</head>
<body>
<header>
 <h1>UniOB<span>组件原型</span></h1>
 <nav aria-label="原型选择">
  <a href="#01" data-file="01-watermarks.html" aria-current="page">01 水位调度</a>
  <a href="#02" data-file="02-healthy-node.html">02 常规节点</a>
  <a href="#03" data-file="03-fleet-summary.html">03 全网概览</a>
  <a href="#04" data-file="04-scch-hub.html">04 SCCH 中枢</a>
  <a href="#05" data-file="05-alert-node.html">05 告警节点</a>
 </nav>
 <a class="open" id="open" href="01-watermarks.html" target="_blank" rel="noopener">单独打开 ↗</a>
</header>
<main><iframe id="prototype" src="01-watermarks.html" title="01 水位调度原型"></iframe></main>
<script>
const links = [...document.querySelectorAll('nav a')];
function select() {
 const selected = links.find(link => link.hash === location.hash) || links[0];
 for(const link of links) link === selected ? link.setAttribute('aria-current','page') : link.removeAttribute('aria-current');
 const frame = document.getElementById('prototype');
 if(frame.getAttribute('src') !== selected.dataset.file) frame.src = selected.dataset.file;
 frame.title = selected.textContent + '原型';
 document.getElementById('open').href = selected.dataset.file;
 document.title = 'UniOB · ' + selected.textContent;
}
window.addEventListener('hashchange',select);select();
</script>
</body>
</html>
