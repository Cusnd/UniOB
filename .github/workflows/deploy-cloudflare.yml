name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Cloudflare Worker
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.ENABLE_CF_AUTO_DEPLOY == 'true' &&
        (github.event_name == 'release' ||
          (github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository)))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Validate required Cloudflare secrets and variables
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID || vars.CF_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          missing=0
          for key in CF_API_TOKEN CF_ACCOUNT_ID CF_D1_DATABASE_ID; do
            if [ -z "${!key:-}" ]; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            {
              echo "### Missing Cloudflare Deployment Configuration"
              echo ""
              echo "Please configure these Repository **Secrets** / **Variables** under **Settings -> Secrets and variables -> Actions**:"
              echo "- Secret \`CLOUDFLARE_API_TOKEN\`: Cloudflare API Token with Workers Scripts, D1, and Workers Routes permissions"
              echo "- Secret or Variable \`CLOUDFLARE_ACCOUNT_ID\`: Your Cloudflare Account ID"
              echo "- Variable \`CF_D1_DATABASE_ID\`: UUID of your \`uniob-meta\` D1 database"
              echo "- Variable \`ENABLE_CF_AUTO_DEPLOY\` (optional): Set to \`true\` to enable automatic deploys on push/release"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing required Cloudflare secrets/variables (see Job Summary)."
            exit 1
          fi

      - name: Download latest Release binaries into edge static assets (optional)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p web/public/releases
          if gh release download --repo "${{ github.repository }}" --dir web/public/releases --pattern '*' --clobber; then
            rm -f web/public/releases/uniob-web-dist.tar.gz
            ls -lh web/public/releases
          else
            echo "::warning::Could not download the latest GitHub Release; installers will fall back to GitHub Releases when available."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      - name: Install web and worker dependencies
        run: |
          npm --prefix web ci
          npm --prefix worker ci

      - name: Build web dist
        run: npm run build:web

      - name: Inject deployment config into worker/wrangler.jsonc
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID || vars.CF_D1_DATABASE_ID }}
          CF_CUSTOM_DOMAIN: ${{ vars.CF_CUSTOM_DOMAIN }}
          CF_WORKERS_DEV: ${{ vars.CF_WORKERS_DEV }}
          CF_WORKERS_PLAN: ${{ vars.CF_WORKERS_PLAN }}
          CF_AUTH_MODE: ${{ vars.CF_AUTH_MODE }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD || vars.CF_ACCESS_AUD }}
          CF_ACCESS_ALLOWED_EMAILS: ${{ vars.CF_ACCESS_ALLOWED_EMAILS }}
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const path = "worker/wrangler.jsonc";

          function parsePlan(raw) {
            if (typeof raw !== "string") return null;
            const v = raw.trim().toLowerCase();
            if (v === "free" || v === "workers_free" || v === "workers-free") return "free";
            if (v === "paid" || v === "workers_paid" || v === "workers-paid") return "paid";
            return null;
          }

          function isSubWorkersPaid(sub) {
            if (!sub || typeof sub !== "object") return false;
            const state = typeof sub.state === "string" ? sub.state.trim().toLowerCase() : "";
            if (state === "cancelled" || state === "canceled" || state === "expired" || state === "deactivated") {
              return false;
            }
            if (state && !["paid", "provisioned", "trial", "active"].includes(state)) {
              return false;
            }
            const rp = sub.rate_plan && typeof sub.rate_plan === "object" ? sub.rate_plan : {};
            const id = typeof rp.id === "string" ? rp.id.trim().toLowerCase() : "";
            const name = typeof rp.public_name === "string" ? rp.public_name.trim().toLowerCase() : "";
            return (
              id === "workers_paid" ||
              id === "partners_workers_paid" ||
              id.startsWith("workers_paid") ||
              id === "unbound_paid" ||
              name.includes("workers paid")
            );
          }

          (async () => {
            const raw = fs.readFileSync(path, "utf8");

            // Strip // line comments outside quoted JSON strings before parsing
            let cleaned = "";
            let inString = false;
            let escaped = false;
            for (let i = 0; i < raw.length; i++) {
              const ch = raw[i];
              if (inString) {
                cleaned += ch;
                if (escaped) {
                  escaped = false;
                } else if (ch === "\\") {
                  escaped = true;
                } else if (ch === "\"") {
                  inString = false;
                }
                continue;
              }
              if (ch === "\"") {
                inString = true;
                cleaned += ch;
                continue;
              }
              if (ch === "/" && raw[i + 1] === "/") {
                while (i < raw.length && raw[i] !== "\n") {
                  i++;
                }
                if (i < raw.length) {
                  cleaned += "\n";
                }
                continue;
              }
              cleaned += ch;
            }

            const config = JSON.parse(cleaned);
            const accountId = process.env.CF_ACCOUNT_ID.trim();
            config.account_id = accountId;
            config.d1_databases[0].database_id = process.env.CF_D1_DATABASE_ID.trim();
            config.vars = config.vars || {};
            config.vars.GITHUB_REPO = process.env.GITHUB_REPOSITORY || config.vars.GITHUB_REPO;

            const customDomain = (process.env.CF_CUSTOM_DOMAIN || "").trim();
            if (customDomain) {
              config.routes = [{ pattern: customDomain, custom_domain: true }];
              config.workers_dev = process.env.CF_WORKERS_DEV === "true";
            } else if (process.env.CF_WORKERS_DEV === "false") {
              config.workers_dev = false;
            }

            if (process.env.CF_AUTH_MODE) {
              config.vars.AUTH_MODE = process.env.CF_AUTH_MODE.trim();
            }
            if (process.env.CF_ACCESS_TEAM_DOMAIN) {
              config.vars.CF_ACCESS_TEAM_DOMAIN = process.env.CF_ACCESS_TEAM_DOMAIN.trim();
            }
            if (process.env.CF_ACCESS_AUD) {
              config.vars.CF_ACCESS_AUD = process.env.CF_ACCESS_AUD.trim();
            }
            if (process.env.CF_ACCESS_ALLOWED_EMAILS) {
              config.vars.CF_ACCESS_ALLOWED_EMAILS = process.env.CF_ACCESS_ALLOWED_EMAILS.trim();
            }

            const explicitPlan = parsePlan(process.env.CF_WORKERS_PLAN);
            if (explicitPlan) {
              config.vars.CF_WORKERS_PLAN = explicitPlan;
              console.log(`Configured CF_WORKERS_PLAN=${explicitPlan} from variable.`);
            } else if (process.env.CF_API_TOKEN && accountId) {
              try {
                const res = await fetch(
                  `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}/subscriptions`,
                  {
                    headers: {
                      Authorization: `Bearer ${process.env.CF_API_TOKEN.trim()}`,
                      Accept: "application/json",
                    },
                    signal: AbortSignal.timeout(4000),
                  },
                );
                if (res.ok) {
                  const body = await res.json();
                  if (body && body.success === true && Array.isArray(body.result)) {
                    const detected = body.result.some(isSubWorkersPaid) ? "paid" : "free";
                    config.vars.CF_WORKERS_PLAN = detected;
                    console.log(`Auto-detected CF_WORKERS_PLAN=${detected} via Cloudflare Subscriptions API.`);
                  }
                } else {
                  console.log(`Cloudflare Subscriptions API returned HTTP ${res.status}; leaving CF_WORKERS_PLAN unset for manual UI selection.`);
                }
              } catch (err) {
                console.log(`Skipped Cloudflare plan auto-detection (${err instanceof Error ? err.message : "error"}); manual UI selection remains available.`);
              }
            }

            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n", "utf8");
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Apply D1 database migrations (--remote)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply uniob-meta --remote

      - name: Deploy Cloudflare Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
