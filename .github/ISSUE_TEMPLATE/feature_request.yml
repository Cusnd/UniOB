name: Feature Request
description: Suggest an improvement or new capability for UniOB
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent Metrics / Collection
        - Dashboard UI / UX
        - Alerting & Notification Channels
        - Cloudflare Workers / Edge Cost Optimization
        - Self-Hosted Hub / Migration
        - Documentation / Tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the pain point or use case you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you envision this working, keeping low overhead and dual-mode compatibility in mind.
    validations:
      required: true
