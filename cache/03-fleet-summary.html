    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3a7 7 0 0 0 11.5-1"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="m10.4 4.7-7.5 13a1.8 1.8 0 0 0 1.6 2.7h15a1.8 1.8 0 0 0 1.6-2.7l-7.5-13a1.8 1.8 0 0 0-3.2 0Z"/><path d="M12 9v4m0 3v.1"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-7l1-7Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9S4 17 4 12V6l8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-offline" viewBox="0 0 24 24"><path d="m4 4 16 16M9 5h9a2 2 0 0 1 2 2v8M5 8v10a2 2 0 0 0 2 2h10M8 16h3"/></symbol>
  </defs></svg>
  <main class="workspace">
    <h1 class="sr-only">全网概览</h1>
    <div class="summary" aria-label="全网运行摘要">
      <section class="metric fleet" aria-labelledby="fleet-heading">
        <div class="metric-head"><h2 id="fleet-heading"><button class="title-button" type="button" data-action="nodes" data-filter="all" aria-haspopup="dialog">在线节点 · 帧态分布<svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></h2><span class="health-dot" title="1 台节点离线" aria-label="存在离线节点"></span></div>
        <div class="metric-value"><button class="value-button" type="button" data-action="nodes" data-filter="online" aria-haspopup="dialog" aria-label="查看 10 台在线节点，共 11 台"><span class="large">10</span><span class="denominator">/ 11</span></button><span class="rate">90.9%</span></div>
        <div class="metric-bottom status-list" aria-label="按帧态筛选节点"><button class="status-pill" type="button" data-action="nodes" data-filter="idle" aria-haspopup="dialog"><span class="dot" aria-hidden="true"></span>Idle <span>7</span></button><button class="status-pill live" type="button" data-action="nodes" data-filter="live" aria-haspopup="dialog"><span class="dot" aria-hidden="true"></span>Live <span>2</span></button><button class="status-pill offline" type="button" data-action="nodes" data-filter="offline" aria-haspopup="dialog"><span class="dot" aria-hidden="true"></span>离线 <span>1</span></button></div>
      </section>
      <section class="metric memory" aria-labelledby="memory-heading">
        <div class="metric-head"><h2 id="memory-heading"><button class="title-button" type="button" data-action="resources" aria-haspopup="dialog">算力与内存余量<svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></h2><div class="cpu-mini">均 CPU <strong>29.2%</strong></div></div>
        <div class="metric-value"><span class="available-label">余</span><span class="large">24.4<span class="unit">GB</span></span><span class="denominator">/ 38 GB</span></div>
        <div class="metric-bottom"><div class="meter-label"><span>内存已用</span><strong>35.8%</strong></div><div class="track" role="meter" aria-label="在线节点内存使用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35.8" aria-valuetext="已用 13.6 GB，总计 38 GB"><span style="width:35.8%"></span></div></div>
      </section>
      <section class="metric probe" aria-labelledby="probe-heading">
        <div class="metric-head"><h2 id="probe-heading"><button class="title-button" type="button" data-action="swap" aria-haspopup="dialog">小鸡 Swap 哨兵<svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button><span class="overline">≤ 2 GB</span></h2><button class="quiet-badge" type="button" data-action="swap" aria-haspopup="dialog" aria-label="查看 7 台小内存节点">7 台</button></div>
        <div class="metric-value"><span class="probe-label">探针均</span><span class="large">4.2<span class="unit"> MB</span></span><span class="rust-label">Rust<br>零依赖</span></div>
        <div class="metric-bottom"><button class="warning-link" type="button" data-action="alerts" data-alert="swap" aria-haspopup="dialog" aria-label="查看 sgp-tiny-relay 的 Swap 82.2% 告警"><svg class="icon" aria-hidden="true"><use href="#i-warning"/></svg><span class="node-name">sgp-tiny-relay</span><span class="swap-value">Swap 82.2%</span></button></div>
      </section>
      <section class="metric budget" aria-labelledby="budget-heading">
        <div class="metric-head"><h2 id="budget-heading"><button class="title-button" type="button" data-action="budget" aria-haspopup="dialog">SCCH 日写入预算<svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></h2><span class="free-tier">Free Tier</span></div>
        <div class="metric-value"><span class="large">18.4k</span><span class="denominator">/ 100k</span></div>
        <div class="metric-bottom"><div class="meter-label"><span>今日额度</span><strong>18.4%</strong></div><div class="track" role="meter" aria-label="SCCH 今日写入额度" aria-valuemin="0" aria-valuemax="100000" aria-valuenow="18400" aria-valuetext="已用 18,400 次，共 100,000 次，18.4%"><span style="width:18.4%"></span></div></div>
      </section>
      <section class="metric edge" aria-labelledby="edge-heading">
        <div class="metric-head"><h2 class="edge-title" id="edge-heading"><svg class="icon" aria-hidden="true"><use href="#i-zap"/></svg><span>边缘越界上送延迟</span></h2><button class="alerts-badge" type="button" data-action="alerts" aria-haspopup="dialog">2 告警中</button></div>
        <div class="metric-value"><span class="large">0<span class="unit">s</span></span><span class="reason">reason="edge"<span>即刻穿透</span></span></div>
        <div class="metric-bottom edge-bottom"><span><strong>3%</strong> 迟滞防抖</span><span class="divider" aria-hidden="true"></span><span>DO 休眠率 <strong>96.4%</strong></span></div>
      </section>
    </div>
  </main>
  <dialog id="details" aria-labelledby="detail-title" aria-describedby="detail-subtitle">
    <div class="dialog-layout"><header class="dialog-head"><div><h2 id="detail-title"></h2><p id="detail-subtitle"></p></div><button class="close-button" type="button" data-close="details" aria-label="关闭详情"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></header><div class="dialog-body" id="detail-body"></div><footer class="dialog-footer"><span>本地演示数据</span><button class="button" type="button" data-close="details">完成</button></footer></div>
  </dialog>
  <dialog id="alerts" class="drawer" aria-labelledby="alerts-title" aria-describedby="alerts-subtitle">
    <div class="dialog-layout"><header class="dialog-head"><div><h2 id="alerts-title">当前告警 <span class="mono" style="font-size:14px;color:#9aa3b1;margin-left:5px">02</span></h2><p id="alerts-subtitle">2 条待确认</p></div><button class="close-button" type="button" data-close="alerts" aria-label="关闭告警"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></header><div class="dialog-body"><label class="check-filter"><input type="checkbox" id="unread-only">仅看待确认</label><div class="alert-list" id="alert-list"></div></div><footer class="dialog-footer"><span><svg class="icon" aria-hidden="true" style="width:12px;height:12px;margin-right:3px"><use href="#i-clock"/></svg>迟滞阈值 3%</span><span>本地演示</span></footer></div>
  </dialog>
  <script>
    'use strict';
    const nodes = [
      {id:'sgp-tiny-relay', region:'新加坡', state:'live', cpu:92.8, free:.1, memory:1, probe:4.6, swap:82.2},
      {id:'hkg-edge-01', region:'香港', state:'idle', cpu:21, free:1.2, memory:2, probe:4.2, swap:.8},
      {id:'tokyo-edge-01', region:'东京', state:'live', cpu:25.4, free:.5, memory:1, probe:4.1, swap:0},
      {id:'lax-micro-01', region:'洛杉矶', state:'idle', cpu:14, free:1.4, memory:2, probe:4.0, swap:0},
      {id:'ams-micro-01', region:'阿姆斯特丹', state:'idle', cpu:17, free:1.3, memory:2, probe:4.3, swap:1.2},
      {id:'syd-micro-01', region:'悉尼', state:'idle', cpu:12, free:.5, memory:1, probe:4.1, swap:0},
      {id:'lon-micro-01', region:'伦敦', state:'idle', cpu:18, free:.7, memory:1, probe:4.1, swap:0},
      {id:'fra-worker-01', region:'法兰克福', state:'idle', cpu:30, free:2.9, memory:4},
      {id:'sjc-core-01', region:'圣何塞', state:'idle', cpu:37.8, free:5.5, memory:8},
      {id:'nrt-core-01', region:'东京', state:'sync', cpu:24, free:10.3, memory:16},
      {id:'lax-backup-01', region:'洛杉矶', state:'offline', cpu:null, free:null, memory:2}
    ];
    const stateLabels = {idle:'Idle',live:'Live',sync:'待首帧',offline:'离线'};
    const detailDialog = document.getElementById('details');
    const alertDialog = document.getElementById('alerts');
    const detailBody = document.getElementById('detail-body');
    const alertStates = {swap:false,offline:false};
    let currentFilter = 'all';
    let currentSearch = '';
    const icon = name => '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
    const number = value => value.toFixed(1);
    function showDetail(title, subtitle, html){
      if(alertDialog.open) alertDialog.close();
      document.getElementById('detail-title').textContent = title;
      document.getElementById('detail-subtitle').textContent = subtitle;
      detailBody.innerHTML = html;
      if(!detailDialog.open) detailDialog.showModal();
      detailBody.scrollTop = 0;
    }
    function filterCount(filter){return nodes.filter(n => filter === 'all' || (filter === 'online' ? n.state !== 'offline' : n.state === filter)).length;}
    function renderNodeRows(){
      const shown = nodes.filter(n => (currentFilter === 'all' || (currentFilter === 'online' ? n.state !== 'offline' : n.state === currentFilter)) && (n.id + ' ' + n.region).toLowerCase().includes(currentSearch.toLowerCase()));
      document.getElementById('node-rows').innerHTML = shown.length ? shown.map(n => '<tr><td class="node">'+n.id+'</td><td>'+n.region+'</td><td><span class="status-tag '+n.state+'">'+stateLabels[n.state]+'</span></td><td class="mono">'+(n.cpu === null ? '—' : n.cpu.toFixed(1)+'%')+'</td><td class="mono">'+(n.free === null ? '—' : number(n.free)+' / '+n.memory+' GB')+'</td></tr>').join('') : '<tr><td class="table-empty" colspan="5">没有匹配的节点</td></tr>';
      document.getElementById('node-count').textContent = shown.length + ' 台节点' + (shown.some(n => n.state === 'sync') ? ' · 含 1 台等待首帧' : '');
      detailBody.querySelectorAll('[data-filter-node]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.filterNode === currentFilter)));
    }
    function openNodes(filter = 'all', search = ''){
      currentFilter = filter;
      currentSearch = search;
      const filters = [['all','全部'],['online','在线'],['idle','Idle'],['live','Live'],['sync','待首帧'],['offline','离线']];
      showDetail('节点状态','10 / 11 在线 · 在线率 90.9%',
        '<div class="filters" role="group" aria-label="节点状态筛选">'+filters.map(([key,label]) => '<button class="filter" type="button" data-filter-node="'+key+'" aria-pressed="'+(key===filter)+'">'+label+' <span class="mono">'+filterCount(key)+'</span></button>').join('')+'</div>'+ 
        '<label class="search">'+icon('search')+'<span class="sr-only">搜索节点或地区</span><input id="node-search" type="search" placeholder="搜索节点或地区" autocomplete="off"></label>'+
        '<div class="table-scroll" tabindex="0" role="region" aria-label="节点列表，可横向滚动"><table><thead><tr><th scope="col">节点</th><th scope="col">地区</th><th scope="col">帧态</th><th scope="col">CPU</th><th scope="col">可用内存</th></tr></thead><tbody id="node-rows"></tbody></table></div><p class="data-note"><span id="node-count" aria-live="polite"></span></p>');
      const searchInput = document.getElementById('node-search');
      searchInput.value = search;
      searchInput.addEventListener('input', event => {currentSearch = event.target.value; renderNodeRows();});
      renderNodeRows();
    }
    function openResources(){
      const connected = nodes.filter(n => n.state !== 'offline');
      showDetail('算力与内存','10 台在线节点 · 离线节点不计入总量',
        '<div class="detail-stats"><dl class="detail-stat"><dt>平均 CPU</dt><dd>29.2<small>%</small></dd></dl><dl class="detail-stat"><dt>可用内存</dt><dd>24.4<small>GB</small></dd></dl><dl class="detail-stat"><dt>总内存</dt><dd>38<small>GB</small></dd></dl></div>'+
        '<div class="table-scroll" tabindex="0" role="region" aria-label="节点资源列表，可横向滚动"><table><thead><tr><th scope="col">节点</th><th scope="col">CPU 使用率</th><th scope="col">可用 / 总内存</th></tr></thead><tbody>'+connected.map(n=>'<tr><td class="node">'+n.id+'</td><td class="mono"><span class="mini-track" aria-hidden="true"><span style="width:'+n.cpu+'%"></span></span>'+n.cpu.toFixed(1)+'%</td><td class="mono">'+number(n.free)+' / '+n.memory+' GB</td></tr>').join('')+'</tbody></table></div>');
    }
    function openSwap(){
      const tiny = nodes.filter(n => n.memory <= 2 && n.state !== 'offline');
      showDetail('小鸡 Swap 哨兵','监测 ≤ 2 GB 的在线节点',
        '<div class="detail-stats"><dl class="detail-stat"><dt>监测节点</dt><dd>7<small>台</small></dd></dl><dl class="detail-stat"><dt>探针平均内存</dt><dd>4.2<small>MB</small></dd></dl><dl class="detail-stat"><dt>Swap 告警</dt><dd class="warm">1<small>台</small></dd></dl></div>'+
        '<div class="table-scroll" tabindex="0" role="region" aria-label="小内存节点列表，可横向滚动"><table class="swap-table"><thead><tr><th scope="col">节点</th><th scope="col">内存</th><th scope="col">探针</th><th scope="col">Swap</th></tr></thead><tbody>'+tiny.map(n=>'<tr'+(n.swap>80?' class="hot"':'')+'><td class="node">'+n.id+'</td><td class="mono">'+n.memory+' GB</td><td class="mono">'+number(n.probe)+' MB</td><td class="mono '+(n.swap>80?'warm':'')+'">'+(n.swap>80?icon('warning')+' ':'')+number(n.swap)+'%</td></tr>').join('')+'</tbody></table></div><p class="data-note">Rust 只读探针 · 零运行时依赖</p>');
    }
    function openBudget(){
      showDetail('SCCH 日写入预算','Free Tier · 今日写入明细',
        '<div class="budget-hero"><div class="budget-numbers"><div><strong>18,400</strong> <small>/ 100,000</small></div><span>18.4%</span></div><div class="track" role="meter" aria-label="已用写入额度" aria-valuemin="0" aria-valuemax="100000" aria-valuenow="18400"><span style="width:18.4%"></span></div><div class="budget-caption"><span>剩余额度 <b class="mono">81,600</b> 次</span><span>UTC 00:00 重置</span></div></div>'+
        '<dl class="quota-list"><div><dt>心跳与在线状态</dt><dd>8,100</dd></div><div><dt>边缘越界上送</dt><dd>6,700</dd></div><div><dt>帧态变更</dt><dd>3,600</dd></div></dl>');
    }
    function renderAlerts(){
      const onlyUnread = document.getElementById('unread-only').checked;
      const items = [
        {id:'swap',node:'sgp-tiny-relay',title:'Swap 占用越界',time:'2m',symbol:'warning',label:'当前占用',value:'82.2',unit:'%',threshold:'上送阈值',limit:'80.0%'},
        {id:'offline',node:'lax-backup-01',title:'节点心跳超时',time:'4m',symbol:'offline',label:'距最近心跳',value:'3',unit:'m 48s',threshold:'离线阈值',limit:'90s'}
      ];
      const shown = items.filter(a => !onlyUnread || !alertStates[a.id]);
      document.getElementById('alerts-subtitle').textContent = Object.values(alertStates).filter(v=>!v).length + ' 条待确认 · 2 条仍在持续';
      document.getElementById('alert-list').innerHTML = shown.length ? shown.map(a => '<article class="alert-card" id="alert-'+a.id+'"><div class="alert-card-head"><span class="alert-symbol '+a.id+'">'+icon(a.symbol)+'</span><div><h3>'+a.title+'</h3><span class="node-id">'+a.node+'</span></div><span class="alert-time">'+a.time+' 前</span></div><div class="alert-values"><div><span>'+a.label+'</span><strong>'+a.value+'<small> '+a.unit+'</small></strong></div><div class="limit"><span>'+a.threshold+'</span><strong>'+a.limit+'</strong></div></div><div class="alert-actions"><button class="text-button" type="button" data-view-node="'+a.node+'">查看节点 '+icon('arrow')+'</button><button class="ack-button" type="button" data-ack="'+a.id+'" '+(alertStates[a.id]?'disabled':'')+'>'+(alertStates[a.id]?'✓ 已确认':'确认告警')+'</button></div></article>').join('') : '<div class="alert-empty">所有告警已确认</div>';
    }
    function openAlerts(alertId){
      if(detailDialog.open) detailDialog.close();
      document.getElementById('unread-only').checked = false;
      renderAlerts();
      if(!alertDialog.open) alertDialog.showModal();
      if(alertId){const card = document.getElementById('alert-'+alertId); if(card) card.scrollIntoView({block:'nearest'});}
    }
    document.addEventListener('click', event => {
      const button = event.target.closest('button');
      if(!button) return;
      if(button.dataset.close){document.getElementById(button.dataset.close).close();return;}
      if(button.dataset.filterNode){currentFilter=button.dataset.filterNode;renderNodeRows();return;}
      if(button.dataset.viewNode){openNodes('all',button.dataset.viewNode);return;}
      if(button.dataset.ack){
        const id = button.dataset.ack;
        alertStates[id] = true;
        renderAlerts();
        const next = document.querySelector('#alert-list .ack-button:not(:disabled)');
        if(next) next.focus(); else document.getElementById('unread-only').focus();
        return;
      }
      switch(button.dataset.action){
        case 'nodes':openNodes(button.dataset.filter || 'all');break;
        case 'resources':openResources();break;
        case 'swap':openSwap();break;
        case 'budget':openBudget();break;
        case 'alerts':openAlerts(button.dataset.alert);break;
      }
    });
    document.getElementById('unread-only').addEventListener('change', renderAlerts);
    for(const dialog of [detailDialog,alertDialog]){
      let pointerStartedOutside = false;
      dialog.addEventListener('pointerdown', event => {
        const rect = dialog.getBoundingClientRect();
        pointerStartedOutside = event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
      });
      dialog.addEventListener('click', event => {
        if(!pointerStartedOutside) return;
        const rect = dialog.getBoundingClientRect();
        if(event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
        pointerStartedOutside = false;
      });
    }
  </script>
</body>
</html>
