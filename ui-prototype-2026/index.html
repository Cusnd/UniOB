<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#07090e" />
    <title>UniOB Horizon 2026 — 边缘与混合云可观测性控制台 (UI Prototype)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var storedTheme = localStorage.getItem("uniob_horizon_theme");
          var mode =
            storedTheme === "dark" ||
            storedTheme === "light" ||
            storedTheme === "system"
              ? storedTheme
              : "dark";
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var resolved =
            mode === "system" ? (prefersDark ? "dark" : "light") : mode;
          root.dataset.theme = mode;
          if (resolved === "dark") root.classList.add("dark");
          else root.classList.remove("dark");

          var storedAccent = localStorage.getItem("uniob_horizon_accent");
          root.dataset.accent =
            storedAccent === "emerald" ||
            storedAccent === "indigo" ||
            storedAccent === "cyan"
              ? storedAccent
              : "emerald";

          var storedDensity = localStorage.getItem("uniob_horizon_density");
          root.dataset.density =
            storedDensity === "comfortable" || storedDensity === "compact"
              ? storedDensity
              : "comfortable";

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              resolved === "dark" ? "#07090e" : "#f5f7fa",
            );
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
